<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | TelRooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/login.css') }}">
</head>
<body>
  <header class="header">
    <div class="header-left">
        <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
          <div class="logo-icon"><i class="fas fa-phone-alt"></i></div>
          <div class="brand">Tal<span>Rooms</span></div>
        </a>
    </div>
    <div class="header-right">
      <a href="/" style="text-decoration: none;">
        <button class="btn-outline">
          <i class="fas fa-arrow-left"></i>
          <span>На главную</span>
        </button>
      </a>
    </div>
  </header>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">
          <i class="fas fa-user-circle"></i>
        </div>
        <h1>Добро пожаловать</h1>
        <p>Войдите в свой аккаунт, чтобы бронировать комнаты</p>
      </div>

      <form id="loginForm" method="post" action="submit">
        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i> Электронная почта
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@company.ru"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i> Пароль
          </label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Введите пароль"
            required
          >
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" checked>
            Запомнить меня
          </label>
          <a href="#" class="forgot-link">Забыли пароль?</a>
        </div>

        <button type="submit" class="btn-login">
          <i class="fas fa-sign-in-alt"></i> Войти
        </button>
      </form>

      <div class="divider-text">
        <span>или войдите через</span>
      </div>

      <div class="social-login">
        <button class="social-btn google">
          <i class="fab fa-google"></i> Google
        </button>
        <button class="social-btn github">
          <i class="fab fa-github"></i> GitHub
        </button>
      </div>

      <div class="register-link">
        Нет аккаунта? <a href="/auth/register">Зарегистрироваться</a>
      </div>
    </div>
  </div>

  <div class="footer-note">
    <span><i class="fas fa-shield-alt"></i> Безопасный вход</span>
    <span><i class="fas fa-lock"></i> SSL шифрование</span>
    <span><i class="fas fa-headset"></i> Поддержка 24/7</span>
  </div>

  <script src="{{ url_for('static', path='js/login.js') }}"></script>
</body>
</html>
