<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детали бронирования | TalRooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/booked_room.css') }}">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
        <div class="logo-icon"><i class="fas fa-phone-alt"></i></div>
        <div class="brand">Tal<span>Rooms</span></div>
      </a>
    </div>
    <div class="header-right">
      <div class="header-badge">
        <i class="fas fa-bell"></i> Уведомлений нет
      </div>
      <div class="divider"></div>
      <div class="header-badge" style="background: transparent; border: none; padding: 0;">
        <i class="fas fa-calendar-alt" style="color: #2a7de1;"></i>
        <span style="font-weight: 500; color: #1f2a44;">{{ today_date }}</span>
      </div>
      <div id="authContainer">
        <a href="/auth/login" style="text-decoration: none;">
          <button id="authButton" class="btn-primary">
            <i class="fas fa-sign-in-alt"></i> Вход
          </button>
        </a>
      </div>
    </div>
  </header>

  <div class="container">
    <a href="/user/profile/{{ user_id }}" class="back-link">
      <i class="fas fa-arrow-left"></i> Назад к списку
    </a>

    <div class="booking-detail-card" id="bookingDetail">

      <div id="skeletonLoader" data-booking-date="{{ booking_date }}" data-booked-by-id="{{ booked_by_id }}" data-booking-date-service="{{ booking_date_service }}">
        <div style="display: flex; justify-content: space-between; align-items: flex-start;">
          <div style="display: flex; gap: 16px; align-items: center;">
            <div class="skeleton" style="width: 56px; height: 56px; border-radius: 18px; background: #eef3fa;"></div>
            <div>
              <div class="skeleton-text" style="width: 200px;"></div>
              <div class="skeleton-text" style="width: 150px; height: 16px; margin-top: 6px;"></div>
            </div>
          </div>
          <div class="skeleton" style="width: 120px; height: 36px; border-radius: 40px; background: #eef3fa;"></div>
        </div>

        <div class="detail-grid">
          <div class="detail-item">
            <span class="label"><i class="far fa-calendar-alt"></i> Дата</span>
            <span class="value">{{ booking_date }}</span>
          </div>
          <div><div class="skeleton-text" style="width: 80px;"></div><div class="skeleton-text" style="width: 140px; margin-top: 4px;"></div></div>
          <div><div class="skeleton-text" style="width: 80px;"></div><div class="skeleton-text" style="width: 140px; margin-top: 4px;"></div></div>
          <div><div class="skeleton-text" style="width: 80px;"></div><div class="skeleton-text" style="width: 140px; margin-top: 4px;"></div></div>
        </div>
        <div class="skeleton-text" style="width: 100%; height: 60px; border-radius: 16px;"></div>
      </div>
      <div id="bookingContent" style="display: none;">
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', path='js/booked_room.js') }}"></script>
</body>
</html>
