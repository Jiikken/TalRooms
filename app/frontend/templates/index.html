<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalRooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/flash.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/index.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/booking_rooms.css') }}">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
        <div class="logo-icon"><i class="fas fa-phone-alt"></i></div>
        <div class="brand">Tal<span>Rooms</span></div>
      </a>
    </div>
    <div class="header-right">
      <div class="header-badge">
        <i class="fas fa-bell"></i> Уведомлений нет
      </div>
      <div class="divider"></div>
      <div class="header-badge" style="background: transparent; border: none; padding: 0;">
        <i class="fas fa-calendar-alt" style="color: #2a7de1;"></i>
        <span style="font-weight: 500; color: #1f2a44;">{{ today_date }}</span>
      </div>
      <div id="authContainer">
        <a href="/auth/login" style="text-decoration: none;">
          <button id="authButton" class="btn-primary">
            <i class="fas fa-sign-in-alt"></i> Вход
          </button>
        </a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="page-title">
      <i class="fas fa-door-open"></i> Доступные комнаты
    </div>
    <div class="subhead">
      <span><i class="fas fa-clock" style="margin-right: 8px; color: #2a7de1;"></i> Выберите комнату для бронирования</span>
      <span class="badge-count" id="roomCountBadge"><i class="fas fa-building"></i> Загрузка...</span>
    </div>

    <div id="roomGrid" class="room-grid">
      <div class="loader"><i class="fas fa-spinner fa-pulse"></i> Загрузка комнат...</div>
    </div>
  </div>
  <script src="{{ url_for('static', path='js/index.js') }}"></script>
</body>
</html>
