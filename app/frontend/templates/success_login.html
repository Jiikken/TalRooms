<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Добро пожаловать! | TalRooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/success_login.css') }}">
</head>
<body>
  <header class="header">
    <div class="header-left">
        <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
          <div class="logo-icon"><i class="fas fa-phone-alt"></i></div>
          <div class="brand">Tal<span>Rooms</span></div>
        </a>
      </div>
    <div class="header-right">
      <button class="btn-logout" onclick="handleLogout()">
        <i class="fas fa-sign-out-alt"></i> Выйти
      </button>
    </div>
  </header>

  <div class="success-container">
    <div class="success-card">
      <div class="success-header">
        <div class="success-icon">
          <i class="fas fa-check"></i>
        </div>
        <h1>Добро пожаловать!</h1>
        <p>Вы успешно вошли в свой аккаунт</p>
      </div>

      <div class="account-info">
        <h3><i class="fas fa-user-circle"></i> Информация об аккаунте</h3>

        <div class="info-row">
          <span class="info-label"><i class="fas fa-user"></i> Имя</span>
          <span class="info-value"> {{ firstname }} {{ lastname }}</span>
        </div>

        <div class="info-row">
          <span class="info-label"><i class="fas fa-envelope"></i> Email</span>
          <span class="info-value"> {{ email }}</span>
        </div>

        <div class="info-row">
          <span class="info-label"><i class="fas fa-clock"></i> Последний вход</span>
          <span class="info-value">{{ last_login }} UTC</span>
        </div>

        <div class="info-row">
          <span class="info-label"><i class="fas fa-shield-alt"></i> Статус</span>
          <span class="info-value">
            <span class="badge-online"><i class="fas fa-circle"></i> В сети</span>
          </span>
        </div>
      </div>

      <div class="activity-stats">
        <div class="stat-item">
          <span class="stat-number" id="bookingCount">12</span>
          <span class="stat-label"><i class="fas fa-calendar-check"></i> Броней</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="meetingHours">48</span>
          <span class="stat-label"><i class="fas fa-clock"></i> Часов</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="roomCount">4</span>
          <span class="stat-label"><i class="fas fa-door-open"></i> Комнат</span>
        </div>
      </div>

      <div class="action-buttons">
        <a href="/user/my" class="btn-primary">
          <i class="fas fa-arrow-right"></i> Личный кабинет
        </a>
        <a href="/" class="btn-secondary">
          <i class="fas fa-home"></i> На главную
        </a>
      </div>
    </div>
  </div>

  <div class="footer-note">
    <span><i class="fas fa-shield-alt"></i> Безопасная сессия</span>
    <span><i class="fas fa-lock"></i> SSL шифрование</span>
    <span><i class="fas fa-headset"></i> Поддержка 24/7</span>
  </div>

  <script src=" {{ url_for('static', path='js/success_login.js') }} "></script>
</body>
</html>
