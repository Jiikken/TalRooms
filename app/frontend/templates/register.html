<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация | TalRooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/register.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/flash.css') }}">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
        <div class="logo-icon"><i class="fas fa-phone-alt"></i></div>
        <div class="brand">Tal<span>Rooms</span></div>
      </a>
    </div>
    <div class="header-right">
      <a href="/" style="text-decoration: none;">
        <button class="btn-outline">
          <i class="fas fa-arrow-left"></i>
          <span>На главную</span>
        </button>
      </a>
    </div>
  </header>

  <div class="register-container">
    <div class="register-card">
      <div class="register-header">
        <div class="register-icon">
          <i class="fas fa-user-plus"></i>
        </div>
        <h1>Создать аккаунт</h1>
        <p>Зарегистрируйтесь, чтобы начать бронировать комнаты</p>
      </div>

      <form id="registerForm" method="post" action="submit">
        <div class="form-row">
          <div class="form-group">
            <label for="firstName">
              <i class="fas fa-user"></i> Имя
            </label>
            <input
              type="text"
              id="firstName"
              name="firstname"
              placeholder="Иван"
              required
            >
          </div>
          <div class="form-group">
            <label for="lastName">
              <i class="fas fa-user"></i> Фамилия
            </label>
            <input
              type="text"
              id="lastName"
              name="lastname"
              placeholder="Петров"
              required
            >
          </div>
        </div>

        <div class="form-group">
          <label for="email">
            <i class="fas fa-envelope"></i> Электронная почта
          </label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="ivan@company.ru"
            required
          >
          <div class="error-message" id="emailError">
            <i class="fas fa-exclamation-circle"></i> Введите корректный email
          </div>
        </div>

        <div class="form-group">
          <label for="password">
            <i class="fas fa-lock"></i> Пароль
          </label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Минимум 8 символов"
            required
          >
          <div class="password-strength">
            <div class="strength-bar">
              <div class="segment" id="str1"></div>
              <div class="segment" id="str2"></div>
              <div class="segment" id="str3"></div>
            </div>
            <span class="strength-text" id="strengthText">Слабый</span>
          </div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">
            <i class="fas fa-check-circle"></i> Подтвердите пароль
          </label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Введите пароль ещё раз"
            required
          >
          <div class="error-message" id="passwordError">
            <i class="fas fa-exclamation-circle"></i> Пароли не совпадают
          </div>
        </div>
        <div class="form-options">
          <input type="checkbox" id="terms" required>
          <label for="terms">
            Я принимаю <a href="#">условия использования</a> и
            <a href="#">политику конфиденциальности</a>
          </label>
        </div>
        <button type="submit" class="btn-register">
          <i class="fas fa-user-plus"></i> Создать аккаунт
        </button>
      </form>

      <div class="divider-text">
        <span>или зарегистрируйтесь через</span>
      </div>

      <div class="social-register">
        <button class="social-btn google">
          <i class="fab fa-google"></i> Google
        </button>
        <button class="social-btn github">
          <i class="fab fa-github"></i> GitHub
        </button>
      </div>

      <div class="login-link">
        Уже есть аккаунт? <a href="/auth/login">Войти</a>
      </div>
    </div>
  </div>

  <div class="footer-note">
    <span><i class="fas fa-shield-alt"></i> Безопасная регистрация</span>
    <span><i class="fas fa-lock"></i> SSL шифрование</span>
    <span><i class="fas fa-headset"></i> Поддержка 24/7</span>
  </div>

  <script src="{{ url_for('static', path='js/register.js') }}"></script>
</body>
</html>
