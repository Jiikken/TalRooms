<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Все бронирования · MeetSpace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/flash.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/all_booked_rooms.css') }}">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
        <div class="logo-icon"><i class="fas fa-phone-alt"></i></div>
        <div class="brand">Tal<span>Rooms</span></div>
      </a>
    </div>
    <div class="header-right">
      <div class="header-badge">
        <i class="fas fa-bell"></i> Уведомлений нет
      </div>
      <div class="divider"></div>
      <div class="header-badge" style="background: transparent; border: none; padding: 0;">
        <i class="fas fa-calendar-alt" style="color: #2a7de1;"></i>
        <span style="font-weight: 500; color: #1f2a44;">{{ today_date }}</span>
      </div>
      <div id="authContainer">
        <a href="/auth/login" style="text-decoration: none;">
          <button id="authButton" class="btn-primary">
            <i class="fas fa-sign-in-alt"></i> Вход
          </button>
        </a>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="flash-container" id="flashContainer"></div>
    <div class="page-header">
      <div class="page-title">
        <i class="fas fa-calendar-check"></i>
        <h1>Все бронирования</h1>
      </div>
      <div class="page-actions">
        <button class="btn-new-booking" onclick="window.location.href = `/booking-rooms`">
          <i class="fas fa-plus"></i> Новое бронирование
        </button>
      </div>
    </div>

    <div class="bookings-list" id="bookingsList">
      <div id="skeletonLoader">
        <div class="stats-bar">
          <div class="skeleton-text" style="width: 120px; height: 24px;"></div>
          <div class="skeleton-text" style="width: 120px; height: 24px;"></div>
          <div class="skeleton-text" style="width: 120px; height: 24px;"></div>
        </div>
        <div class="skeleton-item">
          <div style="display: flex; gap: 1.5rem; flex: 1;">
            <div><div class="skeleton-text long"></div><div class="skeleton-text medium" style="margin-top: 6px;"></div></div>
          </div>
          <div style="display: flex; gap: 10px;">
            <div class="skeleton-circle"></div>
            <div class="skeleton-circle"></div>
          </div>
        </div>
        <div class="skeleton-item">
          <div style="display: flex; gap: 1.5rem; flex: 1;">
            <div><div class="skeleton-text long"></div><div class="skeleton-text medium" style="margin-top: 6px;"></div></div>
          </div>
          <div style="display: flex; gap: 10px;">
            <div class="skeleton-circle"></div>
            <div class="skeleton-circle"></div>
          </div>
        </div>
        <div class="skeleton-item">
          <div style="display: flex; gap: 1.5rem; flex: 1;">
            <div><div class="skeleton-text long"></div><div class="skeleton-text medium" style="margin-top: 6px;"></div></div>
          </div>
          <div style="display: flex; gap: 10px;">
            <div class="skeleton-circle"></div>
            <div class="skeleton-circle"></div>
          </div>
        </div>
      </div>

      <div id="bookingsContent" style="display: none;"></div>
    </div>
  </div>
  <script src=" {{ url_for('static', path='js/flash.js') }}"></script>
  <script src="{{ url_for('static', path='js/utils/auth.js') }}"></script>
  <script src="{{ url_for('static', path='js/all_booked_rooms.js') }}"></script>
</body>
</html>
