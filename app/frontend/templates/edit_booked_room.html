<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Редактирование бронирования | TalRooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/edit_booked_room.css') }}">
</head>
<body>
  <header class="header">
    <div class="header-left">
      <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
        <div class="logo-icon"><i class="fas fa-phone-alt"></i></div>
        <div class="brand">Tal<span>Rooms</span></div>
      </a>
    </div>
    <div class="header-right">
      <div class="header-badge">
        <i class="fas fa-bell"></i> Уведомлений нет
      </div>
      <div class="divider"></div>
      <div class="header-badge" style="background: transparent; border: none; padding: 0;">
        <i class="fas fa-calendar-alt" style="color: #2a7de1;"></i>
        <span style="font-weight: 500; color: #1f2a44;">{{ today_date }}</span>
      </div>
      <div id="authContainer">
        <a href="/auth/login" style="text-decoration: none;">
          <button id="authButton" class="btn-primary">
            <i class="fas fa-sign-in-alt"></i> Вход
          </button>
        </a>
      </div>
    </div>
  </header>

  <div id="toast" class="toast">
    <i class="fas fa-check-circle"></i>
    <span id="toastMessage">Изменения сохранены</span>
  </div>

  <div class="container">
    <a href="" class="back-link" onclick="history.back(); return false;">
      <i class="fas fa-arrow-left"></i> Назад к деталям
    </a>

    <div class="edit-card">
      <div class="edit-header">
        <div class="edit-icon"><i class="fas fa-pen"></i></div>
        <div>
          <h1>Редактирование бронирования</h1>
          <div class="subtitle">Измените детали встречи</div>
        </div>
      </div>

      <div id="skeletonLoader">
        <div class="form-group">
          <div class="skeleton-text" style="width: 120px;"></div>
          <div class="skeleton-input"></div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <div class="skeleton-text" style="width: 100px;"></div>
            <div class="skeleton-input"></div>
          </div>
          <div class="form-group">
            <div class="skeleton-text" style="width: 100px;"></div>
            <div class="skeleton-input"></div>
          </div>
        </div>
        <div class="form-group">
          <div class="skeleton-text" style="width: 140px;"></div>
          <div class="skeleton-input"></div>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 1.5rem;">
          <div class="skeleton" style="width: 140px; height: 48px; border-radius: 40px;"></div>
          <div class="skeleton" style="width: 120px; height: 48px; border-radius: 40px;"></div>
        </div>
      </div>

      <form id="editForm" style="display: none;" onsubmit="handleSubmit(event, {{ room_id }}, '{{ date }}')">
        <div class="form-group">
          <label for="roomSelect"><i class="fas fa-door-open"></i> Переговорная комната</label>
          <div class="input-wrap">
            <i class="fas fa-door-open"></i>
            <select id="roomSelect" required>
              <option value="">Выберите комнату...</option>
            </select>
          </div>
          <div class="help-text"><i class="fas fa-info-circle"></i> Выберите доступную комнату</div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="dateInput"><i class="far fa-calendar-alt"></i> Дата</label>
            <div class="input-wrap">
              <i class="far fa-calendar-alt"></i>
              <input type="date" id="dateInput" required>
            </div>
          </div>
        </div>

        <div class="action-buttons">
          <button type="submit" class="btn-action primary" id="saveButton">
            <i class="fas fa-save"></i> Сохранить изменения
          </button>
          <button type="button" class="btn-action secondary" onclick="history.back()">
            <i class="fas fa-times"></i> Отмена
          </button>
        </div>
      </form>
    </div>
  </div>
  <script src="{{ url_for('static', path='js/utils/auth.js') }}"></script>
  <script src="{{ url_for('static', path='js/edit_booked_room.js') }}"></script>
</body>
</html>
